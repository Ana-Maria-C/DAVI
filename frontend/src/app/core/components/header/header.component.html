<header class="header">
    <div class="logo">
        <button class="hamburger" (click)="toggleSidebar()">
            <span class="icon">☰</span>
        </button>
        <img src="assets/logo.png" alt="DaVi Logo" height="30" onerror="this.style.display='none'">
        <h1>DaVi</h1>
    </div>
    <div class="actions">
        <button class="theme-toggle" (click)="themeService.toggleTheme()">
            {{ (themeService.darkMode$ | async) ? 'Light Mode' : 'Dark Mode' }}
        </button>
    </div>
</header>
